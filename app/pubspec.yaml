name: arcanum
description: "Arcanum: password manager zero-knowledge."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  hotkey_manager: ^0.2.3
  intl: any
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  rust_lib_arcanum:
    path: rust_builder
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
