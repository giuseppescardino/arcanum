name: arcanum
description: "Arcanum: password manager zero-knowledge."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  hotkey_manager: ^0.2.3
  intl: any
  local_auth: ^3.0.2
  package_info_plus: 10.2.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  rust_lib_arcanum:
    path: rust_builder
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/branding/icon_ios_light_1024.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "assets/branding/android_background_432.png"
  adaptive_icon_foreground: "assets/branding/android_foreground_432.png"
  adaptive_icon_monochrome: "assets/branding/android_monochrome_432.png"
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256

flutter_native_splash:
  color: "#283593"
  image: "assets/branding/splash_logo_512.png"
  color_dark: "#161826"
  android_12:
    color: "#283593"
    image: "assets/branding/splash_logo_512.png"
    color_dark: "#161826"
  web: false
