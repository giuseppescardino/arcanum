# Local sync server for development: PostgreSQL + arcanum-server on
# 127.0.0.1:8081, no Caddy. Expose it to your devices over HTTPS with e.g.
#   tailscale serve --bg --https=8443 http://127.0.0.1:8081
#
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
#
# Needs POSTGRES_PASSWORD in deploy/.env (hex only: it goes in a URL) and
# BACKUP_AGE_RECIPIENT for the daily encrypted backups (see .env.example).

name: arcanum-dev

services:
  db:
    image: postgres:18
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: pm
      POSTGRES_DB: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD}@db:5432/pm
      RUST_LOG: info
      ARCANUM_REGISTRATION: ${ARCANUM_REGISTRATION:-invite}
      ARCANUM_MAX_ITEMS_PER_ACCOUNT: ${ARCANUM_MAX_ITEMS_PER_ACCOUNT:-20000}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build: backup
    security_opt: ["no-new-privileges:true"]
    environment:
      PGHOST: db
      PGUSER: pm
      PGDATABASE: pm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: 14
      BACKUP_INTERVAL_HOURS: 24
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
