# Self-hosted sync server: PostgreSQL + arcanum-server + Caddy (automatic HTTPS).
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# Point a DNS record for ARCANUM_DOMAIN at this host before starting, so Caddy
# can obtain a Let's Encrypt certificate. The backup service writes a daily
# age-encrypted dump to BACKUP_DIR (see server/README.md).

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: pm
      POSTGRES_DB: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD}@db:5432/pm
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build: backup
    environment:
      PGHOST: db
      PGUSER: pm
      PGDATABASE: pm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: 14
      BACKUP_INTERVAL_HOURS: 24
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARCANUM_DOMAIN: ${ARCANUM_DOMAIN:?set ARCANUM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
