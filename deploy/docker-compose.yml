# Self-hosted sync server: PostgreSQL + arcanum-server + Caddy (automatic HTTPS).
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# Point a DNS record for ARCANUM_DOMAIN at this host before starting, so Caddy
# can obtain a Let's Encrypt certificate. The backup service writes a daily
# age-encrypted dump to BACKUP_DIR (see server/README.md).

# Logs are capped so they don't fill the disk and IP addresses in them
# don't pile up forever (about 50 MB per service).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # Major version pinned: minor updates are bug and security fixes.
    image: postgres:18
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      POSTGRES_USER: pm
      POSTGRES_DB: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    networks: [edge, backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD}@db:5432/pm
      RUST_LOG: info
      ARCANUM_REGISTRATION: ${ARCANUM_REGISTRATION:-invite}
      ARCANUM_MAX_ITEMS_PER_ACCOUNT: ${ARCANUM_MAX_ITEMS_PER_ACCOUNT:-20000}
      # Client IPs (rate limits, logs) come from Caddy's X-Forwarded-For.
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build: backup
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: pm
      PGDATABASE: pm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: 14
      BACKUP_INTERVAL_HOURS: 24
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      ARCANUM_DOMAIN: ${ARCANUM_DOMAIN:?set ARCANUM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

networks:
  # Caddy and the server; the only network with published ports.
  edge:
  # Server, database and backups: no internet access, unreachable from Caddy.
  backend:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
