[package]
name = "arcanum-bridge"
version = "0.1.0"
description = "Pairing and message encryption between the desktop app and the browser extension"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
x25519-dalek = { version = "2", default-features = false, features = ["zeroize", "static_secrets", "precomputed-tables"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf.workspace = true
sha2.workspace = true
rand_core.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true

[lints]
workspace = true
