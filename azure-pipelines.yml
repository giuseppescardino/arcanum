# CI for Arcanum: Rust core + sync server, Flutter app
# (Android APK, iOS, macOS and Windows desktop), browser extension
# (Chromium zip, Safari app).
#
# Runs only when started by hand (Pipelines > Run pipeline).

trigger: none
pr: none

variables:
  FLUTTER_VERSION: '3.47.7'
  CARGO_TERM_COLOR: always

stages:
  # ---------------------------------------------------------------- backend
  - stage: Backend
    displayName: Core & server
    jobs:
      - job: Core
        displayName: Rust core (lint + test)
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: .azure/steps/install-rust.yml

          - bash: cargo fmt --all --check
            workingDirectory: core
            displayName: cargo fmt

          - bash: cargo clippy --workspace --all-targets --locked -- -D warnings
            workingDirectory: core
            displayName: cargo clippy

          - bash: cargo test --workspace --locked
            workingDirectory: core
            displayName: cargo test

      - job: Server
        displayName: Sync server (lint + test + build)
        pool:
          vmImage: ubuntu-latest
        services:
          postgres: postgres
        variables:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/arcanum_test
        steps:
          - template: .azure/steps/install-rust.yml

          - bash: cargo fmt --check
            workingDirectory: server
            displayName: cargo fmt

          - bash: cargo clippy --all-targets --locked -- -D warnings
            workingDirectory: server
            displayName: cargo clippy

          - bash: cargo test --locked
            workingDirectory: server
            displayName: cargo test (with PostgreSQL)

          - bash: cargo build --release --locked
            workingDirectory: server
            displayName: cargo build --release

          - publish: server/target/release/arcanum-server
            artifact: arcanum-server-linux-x64
            displayName: Publish arcanum-server

      - job: SupplyChain
        displayName: Dependencies (cargo audit + cargo deny)
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: .azure/steps/install-rust.yml

          - bash: cargo install --locked cargo-deny cargo-audit
            displayName: Install cargo-deny and cargo-audit

          # Audit exceptions explained in .github/workflows/ci.yml.
          - bash: cargo deny --locked check && cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071
            workingDirectory: core
            displayName: core

          - bash: cargo deny --locked check && cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071
            workingDirectory: server
            displayName: server

      - job: Docker
        displayName: Docker image
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: docker build -f deploy/Dockerfile -t arcanum-server:$(Build.BuildId) .
            displayName: docker build

  # -------------------------------------------------------------------- app
  - stage: App
    displayName: Flutter app
    dependsOn: []
    jobs:
      - job: Test
        displayName: Analyze & test
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: .azure/steps/install-flutter.yml
            parameters:
              flutterVersion: $(FLUTTER_VERSION)

          - bash: flutter pub get
            workingDirectory: app
            displayName: flutter pub get

          - bash: flutter analyze
            workingDirectory: app
            displayName: flutter analyze

          - bash: flutter test
            workingDirectory: app
            displayName: flutter test

      - job: Extension
        displayName: Browser extension (test + Chromium zip)
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseNode@1
            inputs:
              version: '24.x'
          - bash: npm test
            workingDirectory: extension
            displayName: npm test

          # Zip of src/ for Chrome, Opera and Edge: unzip and "Load
          # unpacked", or upload to a store as is.
          - bash: scripts/package.sh chromium "$(Build.ArtifactStagingDirectory)/extension"
            workingDirectory: extension
            displayName: Package for Chromium

          - publish: $(Build.ArtifactStagingDirectory)/extension
            artifact: extension-chromium
            displayName: Publish Chromium extension

      - job: ExtensionSafari
        displayName: Browser extension (Safari, ad-hoc signed)
        dependsOn: Extension
        pool:
          vmImage: macos-latest
        steps:
          # No team in CI: ad-hoc signed, so Safari needs "Allow Unsigned
          # Extensions" (Develop menu) to run it.
          - bash: scripts/package.sh safari "$(Build.ArtifactStagingDirectory)/safari"
            workingDirectory: extension
            displayName: Build Safari extension

          - publish: $(Build.ArtifactStagingDirectory)/safari
            artifact: extension-safari
            displayName: Publish Safari extension

      - job: Android
        displayName: Android APK
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: .azure/steps/install-rust.yml
            parameters:
              targets: aarch64-linux-android

          - template: .azure/steps/install-flutter.yml
            parameters:
              flutterVersion: $(FLUTTER_VERSION)

          - bash: echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_HOME_17_X64"
            displayName: Use JDK 17

          - bash: flutter build apk --release --target-platform android-arm64
            workingDirectory: app
            displayName: flutter build apk

          - bash: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/android"
              cp build/app/outputs/flutter-apk/app-release.apk \
                "$(Build.ArtifactStagingDirectory)/android/Arcanum-android-arm64.apk"
            workingDirectory: app
            displayName: Stage APK

          - publish: $(Build.ArtifactStagingDirectory)/android
            artifact: app-android
            displayName: Publish APK

      - job: iOS
        displayName: iOS (unsigned build)
        pool:
          vmImage: macos-latest
        steps:
          - template: .azure/steps/install-rust.yml
            parameters:
              targets: aarch64-apple-ios

          - template: .azure/steps/install-flutter.yml
            parameters:
              flutterVersion: $(FLUTTER_VERSION)

          - bash: |
              xcodebuild -version
              pod --version
            displayName: Xcode & CocoaPods version

          # The Rust plugin is CocoaPods-only, so `flutter build` runs
          # `pod install` against ios/Podfile(.lock).
          - bash: flutter build ios --release --no-codesign
            workingDirectory: app
            displayName: flutter build ios

          # Unsigned: re-sign with your own identity before installing.
          - bash: |
              set -euo pipefail
              out="$(Build.ArtifactStagingDirectory)/ios"
              mkdir -p "$out/Payload"
              cp -R build/ios/iphoneos/Runner.app "$out/Payload/"
              (cd "$out" && zip -qry Arcanum-ios-unsigned.ipa Payload && rm -rf Payload)
            workingDirectory: app
            displayName: Stage unsigned IPA

          - publish: $(Build.ArtifactStagingDirectory)/ios
            artifact: app-ios-unsigned
            displayName: Publish iOS build

      - job: macOS
        displayName: macOS (universal, ad-hoc signed)
        pool:
          vmImage: macos-latest
        steps:
          - template: .azure/steps/install-rust.yml
            parameters:
              targets: aarch64-apple-darwin x86_64-apple-darwin

          - template: .azure/steps/install-flutter.yml
            parameters:
              flutterVersion: $(FLUTTER_VERSION)

          # The Release entitlements include a keychain access group, which
          # needs a development team. CI has none, so it signs ad-hoc with a
          # copy that drops it: the app runs, but without Touch ID unlock.
          - bash: |
              set -euo pipefail
              flutter build macos --release --config-only
              ent="$(Agent.TempDirectory)/macos-ci.entitlements"
              cp macos/Runner/Release.entitlements "$ent"
              /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$ent"
              xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
                -configuration Release -derivedDataPath build/macos-ci \
                CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
                CODE_SIGN_ENTITLEMENTS="$ent" build
            workingDirectory: app
            displayName: flutter build macos

          - bash: |
              set -euo pipefail
              out="$(Build.ArtifactStagingDirectory)/macos"
              mkdir -p "$out"
              ditto -c -k --keepParent build/macos-ci/Build/Products/Release/Arcanum.app \
                "$out/Arcanum-macos-universal.zip"
            workingDirectory: app
            displayName: Stage macOS app

          - publish: $(Build.ArtifactStagingDirectory)/macos
            artifact: app-macos
            displayName: Publish macOS build

      - job: Windows
        displayName: Windows desktop
        pool:
          vmImage: windows-latest
        steps:
          - template: .azure/steps/install-rust.yml

          - template: .azure/steps/install-flutter.yml
            parameters:
              flutterVersion: $(FLUTTER_VERSION)

          - bash: flutter build windows --release
            workingDirectory: app
            displayName: flutter build windows

          - publish: app/build/windows/x64/runner/Release
            artifact: app-windows-x64
            displayName: Publish Windows build

resources:
  containers:
    - container: postgres
      image: postgres:16
      ports:
        - 5432:5432
      env:
        POSTGRES_DB: arcanum_test
        POSTGRES_HOST_AUTH_METHOD: trust
