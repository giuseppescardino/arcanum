# Installs the pinned Flutter SDK into the agent's tools directory and puts it
# on PATH. Works on both Linux and Windows agents (Git Bash).
parameters:
  - name: flutterVersion
    type: string

steps:
  - bash: |
      set -euo pipefail
      dir="$(Agent.ToolsDirectory)/flutter-${{ parameters.flutterVersion }}"
      if [ ! -x "$dir/bin/flutter" ]; then
        git clone --depth 1 --branch "${{ parameters.flutterVersion }}" \
          https://github.com/flutter/flutter.git "$dir"
      fi
      echo "##vso[task.prependpath]$dir/bin"
    displayName: Install Flutter ${{ parameters.flutterVersion }}

  - bash: |
      flutter config --no-analytics
      flutter --version
    displayName: Flutter version
