<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Login di prova</title>
<style>body{font:16px system-ui;max-width:360px;margin:40px auto} input{display:block;width:100%;padding:8px;margin:6px 0 14px}</style></head>
<body>
  <h1>Accedi</h1>
  <form id="login" action="welcome.html" method="get">
    <label>Email <input type="email" name="email" autocomplete="username"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">Accedi</button>
  </form>
</body>
</html>
