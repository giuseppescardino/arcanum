<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Registrazione di prova</title>
<style>body{font:16px system-ui;max-width:360px;margin:40px auto} input{display:block;width:100%;padding:8px;margin:6px 0 14px}</style></head>
<body>
  <h1>Crea un account</h1>
  <form id="signup" action="welcome.html" method="get">
    <label>Email <input type="email" name="email"></label>
    <label>Password <input type="password" name="password" autocomplete="new-password"></label>
    <label>Conferma password <input type="password" name="confirm"></label>
    <button type="submit">Registrati</button>
  </form>
</body>
</html>
