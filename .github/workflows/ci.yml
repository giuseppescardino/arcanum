# CI for Arcanum: Rust core + sync server, Flutter app (Android APK, iOS,
# macOS, Windows and Linux desktop), browser extension (Chromium zip, Safari app). Every build is unsigned or ad-hoc signed: no
# secrets, keys or certificates are needed.

name: CI

# Manual runs only: start it from the Actions tab ("Run workflow") or with
# `gh workflow run ci.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------- backend
  core:
    name: Rust core (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  server:
    name: Sync server (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: cargo build --release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: arcanum-server-linux-x64
          path: server/target/release/arcanum-server

  # The end-to-end tests are a workspace of their own (e2e/): they run the
  # server binary and the core sync client, which can't share a lockfile
  # (sqlx and rusqlite pin different libsqlite3-sys versions).
  e2e:
    name: End-to-end (server + PostgreSQL + sync client)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arcanum_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/arcanum_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            e2e
      - name: cargo build (server binary)
        working-directory: server
        run: cargo build --locked
      - name: cargo fmt
        working-directory: e2e
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: e2e
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: e2e
        run: cargo test --locked

  supply-chain:
    name: Dependencies (cargo audit + cargo deny)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [core, server, e2e]
        include:
          - workspace: server
            # Only in the lockfile via sqlx-sqlite, never compiled (the
            # server is Postgres only); core and e2e use the fixed version.
            # Remove once sqlx accepts libsqlite3-sys >= 0.39.
            audit-ignore: --ignore RUSTSEC-2026-0459
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny --locked check
      # cargo deny already checks advisories on the compiled graph; cargo
      # audit scans the whole lockfile. Exceptions:
      # - RUSTSEC-2026-0387 (crypto-bigint): see deny.toml.
      # - RUSTSEC-2023-0071 (rsa): only in sqlx-mysql, listed in the
      #   lockfile but not compiled (Postgres only).
      # - Per workspace: see `audit-ignore` in the matrix.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2023-0071 ${{ matrix.audit-ignore }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -f deploy/Dockerfile -t arcanum-server:${{ github.sha }} .

  # ------------------------------------------------------------ extension
  extension:
    name: Browser extension (test + Chromium zip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # No dependencies: node:test only. The vectors it checks are
      # verified against the Rust core by the core job.
      - run: npm test

      # Zip of src/ for Chrome, Opera and Edge: unzip and "Load unpacked",
      # or upload to a store as is.
      - run: scripts/package.sh chromium "$RUNNER_TEMP/extension"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-chromium
          path: ${{ runner.temp }}/extension

  extension-safari:
    name: Browser extension (Safari, ad-hoc signed)
    runs-on: macos-latest
    needs: extension
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      # No team in CI: ad-hoc signed, so Safari needs "Allow Unsigned
      # Extensions" (Develop menu) to run it.
      - run: scripts/package.sh safari "$RUNNER_TEMP/safari"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-safari
          path: ${{ runner.temp }}/safari

  # ------------------------------------------------------------------ app
  app-test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter test` builds native assets for the host: the cnativeapi
      # build hook (tray_manager / window_manager) needs GTK 3, X11 and Xi.
      - name: Linux native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Release builds use the debug signing config: fine for sideloading,
      # not for the Play Store.
      - name: flutter build apk
        run: flutter build apk --release --target-platform android-arm64

      - name: Stage APK
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/android/Arcanum-android-arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: app-android
          path: ${{ runner.temp }}/android

  ios:
    name: iOS (unsigned build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Xcode & CocoaPods version
        run: |
          xcodebuild -version
          pod --version

      # The Rust plugin is CocoaPods-only, so `flutter build` runs
      # `pod install` against ios/Podfile(.lock).
      - name: flutter build ios
        run: flutter build ios --release --no-codesign

      # Unsigned: re-sign with your own identity before installing.
      - name: Stage unsigned IPA
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ios"
          mkdir -p "$out/Payload"
          cp -R build/ios/iphoneos/Runner.app "$out/Payload/"
          (cd "$out" && zip -qry Arcanum-ios-unsigned.ipa Payload && rm -rf Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: app-ios-unsigned
          path: ${{ runner.temp }}/ios

  macos:
    name: macOS (universal, ad-hoc signed)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The Release entitlements include a keychain access group, which
      # needs a development team. CI has none, so it signs ad-hoc with a
      # copy that drops it: the app runs, but without Touch ID unlock.
      - name: flutter build macos
        run: |
          set -euo pipefail
          flutter build macos --release --config-only
          ent="$RUNNER_TEMP/macos-ci.entitlements"
          cp macos/Runner/Release.entitlements "$ent"
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$ent"
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos-ci \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$ent" build

      - name: Stage macOS app
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/macos"
          mkdir -p "$out"
          ditto -c -k --keepParent build/macos-ci/Build/Products/Release/Arcanum.app \
            "$out/Arcanum-macos-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app-macos
          path: ${{ runner.temp }}/macos

  windows:
    name: Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter build windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v7
        with:
          name: app-windows-x64
          path: app/build/windows/x64/runner/Release

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # GTK for the runner, libsecret for flutter_secure_storage,
      # keybinder for hotkey_manager.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libkeybinder-3.0-dev libx11-dev libxi-dev

      - name: flutter build linux
        run: flutter build linux --release

      # Extract and run ./install.sh (per user, no root) or ./arcanum.
      - name: Stage Linux bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux"
          tar -czf "$RUNNER_TEMP/linux/Arcanum-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle --transform 's,^bundle,arcanum,'

      - uses: actions/upload-artifact@v7
        with:
          name: app-linux-x64
          path: ${{ runner.temp }}/linux
